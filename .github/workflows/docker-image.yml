name: Docker Image CI

"on":
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-image.yml"
      - "local/**"
      - "package-lock.json"
      - "package.json"
      - "packages/**"
      - "scripts/**"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: zzw6776/subboost

jobs:
  prepare:
    name: Prepare Docker Build
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.metadata.outputs.build_version }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "build_version=${version}+sha.${short_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" ]]; then
            echo "::error::Repository variable DOCKERHUB_USERNAME is not configured."
            exit 1
          fi
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is not configured."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Docker metadata
        id: docker_metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: local/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.docker_metadata.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_RELEASE_VERSION=${{ needs.prepare.outputs.version }}
            APP_BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.prepare.outputs.build_version }}
            APP_VERSION_TOKEN=${{ needs.prepare.outputs.build_version }}
          cache-from: type=gha,scope=subboost-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=subboost-${{ matrix.arch }}
          provenance: false

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Multi-Architecture Image
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest and push tags
        shell: bash
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -type f | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "::error::Expected two platform digests, found ${#digest_files[@]}."
            exit 1
          fi

          sources=()
          for file in "${digest_files[@]}"; do
            sources+=("${REGISTRY_IMAGE}@sha256:$(basename "${file}")")
          done

          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:latest" \
            --tag "${REGISTRY_IMAGE}:${VERSION}" \
            --tag "${REGISTRY_IMAGE}:sha-${SHORT_SHA}" \
            "${sources[@]}"

      - name: Inspect published image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
